[package]
name = "msx"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "macos")'.dependencies]
rustfft = "6.4.1"
triple_buffer = "9.0.0"
toybox = { git = "https://github.com/fromvoid-audio/toybox.git", rev = "31bada0da53bc64a2f25ff21065859ff79c439d7", default-features = false, features = ["gpui-vst3"] }
